<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="470" viewBox="0 0 1520 470" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1520" height="470" fill="#ffffff"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#0f172a">文献检索问答 · 运作流程</text>
  <text x="40" y="80" font-size="13" fill="#64748b">问题 → 双路召回 → 统一重排 → 生成 → 带引用的答案</text>

  <!-- 问题 -->
  <rect x="40" y="230" width="150" height="100" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="272" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">用户问题</text>
  <text x="115" y="296" font-size="11" fill="#64748b" text-anchor="middle">自然语言 / 标题</text>

  <line x1="190" y1="280" x2="246" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 召回 -->
  <rect x="250" y="150" width="420" height="260" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="272" y="184" font-size="15" font-weight="700" fill="#334155">① 双路语义召回</text>

  <rect x="270" y="200" width="380" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="290" y="228" font-size="13" font-weight="700" fill="#0f172a">题录索引 · 30 万条</text>
  <text x="290" y="250" font-size="11" fill="#64748b">标题 + 关键词 → 编码检索，取 Top50</text>

  <rect x="270" y="296" width="380" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="290" y="324" font-size="13" font-weight="700" fill="#0f172a">摘要索引 · 39.6 万篇</text>
  <text x="290" y="346" font-size="11" fill="#64748b">标题 + 摘要 + 关键词 → 编码检索，取 Top50</text>

  <line x1="670" y1="280" x2="716" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="693" y="266" font-size="11" fill="#475569" text-anchor="middle">100 候选</text>

  <!-- 重排 -->
  <rect x="720" y="230" width="230" height="100" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="835" y="266" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">② 统一重排</text>
  <text x="835" y="290" font-size="11" fill="#64748b" text-anchor="middle">跨编码器逐条打分</text>
  <text x="835" y="308" font-size="11" fill="#64748b" text-anchor="middle">合并排序后取 Top5</text>

  <line x1="950" y1="280" x2="996" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="973" y="266" font-size="11" fill="#475569" text-anchor="middle">5 条资料</text>

  <!-- 生成 -->
  <rect x="1000" y="230" width="260" height="100" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1130" y="266" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">③ 生成答案</text>
  <text x="1130" y="290" font-size="11" fill="#64748b" text-anchor="middle">资料编号后注入 Prompt</text>
  <text x="1130" y="308" font-size="11" fill="#64748b" text-anchor="middle">大模型流式作答</text>

  <line x1="1260" y1="280" x2="1306" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1283" y="266" font-size="11" fill="#475569" text-anchor="middle">逐字返回</text>

  <!-- 答案 -->
  <rect x="1310" y="230" width="170" height="100" rx="12" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1395" y="266" font-size="15" font-weight="700" fill="#0c4a6e" text-anchor="middle">答案 + 引用</text>
  <text x="1395" y="290" font-size="11" fill="#0369a1" text-anchor="middle">结论中标注 [1]–[5]</text>
  <text x="1395" y="308" font-size="11" fill="#0369a1" text-anchor="middle">对应具体文献</text>
</svg>
